services:
  db:
    image: postgres:16-alpine
    container_name: feira_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feira}
      POSTGRES_DB: ${POSTGRES_DB:-feira}
    ports:
      - "5434:5432"
    volumes:
      - feira_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feira} -d ${POSTGRES_DB:-feira}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: feira_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://feira:feira@db:5432/feira?schema=public}
      NODE_ENV: development
      PORT: "3333"
      # Mesmo motivo do polling do Vite no frontend: bind mount não propaga inotify no Windows.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: feira_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:3333
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

  adminer:
    image: adminer:latest
    container_name: feira_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  feira_pgdata:
