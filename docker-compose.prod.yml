# Compose de produção — usado na VPS, atrás do nginx do host (Certbot) que expõe
# https://13.140.39.163.sslip.io/sistemas/feira/ (ver /etc/nginx/sites-available/planicie).
# Diferente do docker-compose.yml (dev): usa os estágios "prod" dos Dockerfiles (backend compilado,
# frontend estático em nginx) e só o frontend é publicado, e só em 127.0.0.1 — banco e backend
# ficam na rede interna do compose. O nginx do frontend (frontend/nginx.conf) serve o app em
# /sistemas/feira/ e repassa /sistemas/feira/api/ pro backend.
#
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Migração da stack de dev pra esta: scripts/migrar-vps-para-prod.sh

# Nome de projeto próprio: sem isso, os dois compose da mesma pasta seriam o mesmo projeto
# ("feira") e subir este recriaria os containers de dev no lugar.
name: feira-prod

services:
  db:
    image: postgres:16-alpine
    container_name: feira_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-feira}
    volumes:
      - feira_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feira} -d ${POSTGRES_DB:-feira}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    container_name: feira_prod_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-feira}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feira}?schema=public
      NODE_ENV: production
      PORT: "3333"
      # Exigido no POST /import (sem ele, o backend em produção recusa importações).
      # scripts/deploy-vps.sh gera um aleatório no .env.prod se não existir.
      IMPORT_TOKEN: ${IMPORT_TOKEN:-}
      # Login da área /admin (revisão) — também gerados pelo deploy se faltarem.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    # "start" (package.json) só roda o server já buildado — quem aplica as
    # migrations no deploy é este comando, não o script "dev".
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: feira_prod_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FEIRA_PORT:-8091}:80"
    depends_on:
      - backend

volumes:
  feira_prod_pgdata:
