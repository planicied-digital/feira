# Usado só por docker-compose.local-proxy.yml — publica o app na porta fixa
# 8090 do host, seguindo o mesmo padrão dos outros projetos locais
# (http://localhost:8090/sistemas/<app>). Diferente do container "web"
# estático de outros projetos, aqui o alvo é o dev server do Vite, que já
# serve tudo sob o prefixo /sistemas/feira/ (por causa do `base` em
# vite.config.ts) — então o prefixo NÃO é removido no proxy_pass. Os headers
# de Upgrade/Connection são necessários porque o HMR do Vite usa WebSocket.
server {
    listen 80;
    server_name _;

    location /sistemas/feira/ {
        proxy_pass http://frontend:5173/sistemas/feira/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
