# Usado pelo estágio "prod" do Dockerfile (docker-compose.prod.yml). Faz o papel que, em dev, é
# dividido entre o feira_local_proxy (nginx.local-proxy.conf) e o proxy do Vite: serve o build
# estático sob /sistemas/feira/ e repassa /sistemas/feira/api/ pro backend, tirando o prefixo.
# Assim o nginx do host só precisa de um proxy_pass pra este container, sem conhecer o backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /sistemas/feira/api/ {
        proxy_pass http://backend:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache indefinidamente.
    location /sistemas/feira/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas do React Router (ex.: /sistemas/feira/categoria/x) não existem como arquivo —
    # caem no index.html, que nunca deve ser cacheado pra um deploy novo aparecer na hora.
    location /sistemas/feira/ {
        try_files $uri $uri/ /sistemas/feira/index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
