name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feira
          POSTGRES_PASSWORD: feira
          POSTGRES_DB: feira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feira -d feira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://feira:feira@localhost:5432/feira?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # Valida que as migrations (incluindo o SQL cru escrito à mão para pg_trgm e
      # para categorias) aplicam limpo num banco novo, não só no ambiente de dev já evoluído.
      - run: npx prisma migrate deploy

      - run: npx tsc -p tsconfig.json --noEmit

      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx tsc -b

      - run: npm run build
